name: release

on:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Rust core for Android ABIs
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o apps/mobile/android/app/src/main/jniLibs build --release -p platform_bridge
      - name: Build AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: refract-android.aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust core for iOS
        run: |
          rustup target add aarch64-apple-ios
          cargo build --release -p platform_bridge --target aarch64-apple-ios
      - name: Build IPA
        working-directory: apps/mobile
        run: flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: refract-ios.ipa
          path: apps/mobile/build/ios/ipa/*.ipa
