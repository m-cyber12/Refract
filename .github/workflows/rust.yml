name: rust

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Formatting is applied (not gated) because the authoring sandbox has no
      # rustfmt; run `cargo fmt` locally before pushing when possible.
      - name: Format
        run: cargo fmt --all
        continue-on-error: true
      - name: Clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets 2>&1 | tee /tmp/clippy.log
          code=${PIPESTATUS[0]}
          { echo '### clippy output'; echo '```'; cat /tmp/clippy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Test
        run: |
          set +e
          cargo test --workspace 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          { echo '### test output'; echo '```'; tail -100 /tmp/test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Build FFI libraries (host)
        run: cargo build --workspace --release
