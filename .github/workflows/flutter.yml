name: flutter

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The sandbox-authored repo carries lib/ + native sources only; generate
      # the platform project shells (gradle / Xcode) without touching lib/.
      - name: Scaffold platform projects if missing
        working-directory: apps/mobile
        run: flutter create --project-name refract --platforms android,ios .
      - name: Rust core for Dart FFI (host smoke build)
        uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/analyze.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=analyze::$(grep -m10 -E 'error|warning' /tmp/analyze.log | head -c 1500 | tr '\n' ' ')"
          fi
          exit $code
      - name: Test
        working-directory: apps/mobile
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=test::$(grep -m10 -E 'Error|FAILED|Exception' /tmp/test.log | head -c 1500 | tr '\n' ' ')"
          fi
          exit $code
      - name: Android build (smoke)
        working-directory: apps/mobile
        run: |
          flutter build apk --debug
