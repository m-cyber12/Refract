name: android-emulator-smoke

# Real "phone test": boots an Android emulator, installs the debug APK and
# launches REFRACT, then captures a screenshot + logcat as artifacts.
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Scaffold platform projects if missing
        working-directory: apps/mobile
        run: flutter create --project-name refract --org dev.refract --platforms android .
      - name: Build Rust core for Android ABIs
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o apps/mobile/android/app/src/main/jniLibs build --release -p platform_bridge
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n dev.refract/.MainActivity
            sleep 12
            adb shell screencap -p /sdcard/refract-home.png
            adb pull /sdcard/refract-home.png /tmp/refract-home.png
            adb logcat -d > /tmp/refract-logcat.txt
            # Fail the job if the app crashed on launch.
            ! grep -q "FATAL EXCEPTION" /tmp/refract-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: /tmp/refract-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logcat
          path: /tmp/refract-logcat.txt
