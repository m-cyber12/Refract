name: ios-handoff
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths: ['apps/mobile/ios/**', 'apps/mobile/lib/**', '.github/scripts/check_ios_handoff.py', '.github/workflows/ios-handoff.yml', 'crates/**', 'Cargo.toml']
  pull_request:
    paths: ['apps/mobile/ios/**', 'apps/mobile/lib/**', '.github/scripts/check_ios_handoff.py', '.github/workflows/ios-handoff.yml', 'crates/**', 'Cargo.toml']
jobs:
  unsigned-build-and-store:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Shared store tests (real Foundation, files and cross-process locks)
        run: |
          set +e
          swiftc apps/mobile/ios/Shared/HandoffStore.swift apps/mobile/ios/HandoffTests/main.swift -o /tmp/refract-handoff-tests 2>&1 | tee /tmp/swift-store.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=swift-store::$(tail -45 /tmp/swift-store.log | head -c 6000 | tr '\n' ' ')"
            exit $code
          fi
          /tmp/refract-handoff-tests
      - name: Provider representation tests (no source persistence)
        run: |
          set +e
          swiftc apps/mobile/ios/Shared/HandoffStore.swift apps/mobile/ios/Shared/HandoffProvider.swift apps/mobile/ios/HandoffTests/ProviderTests.swift -o /tmp/refract-provider-tests 2>&1 | tee /tmp/swift-provider.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=swift-provider::$(tail -45 /tmp/swift-provider.log | head -c 6000 | tr '\n' ' ')"
            exit $code
          fi
          /tmp/refract-provider-tests 2>&1 | tee /tmp/provider-runtime.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=provider-runtime::$(tail -30 /tmp/provider-runtime.log | head -c 6000 | tr '\n' ' ')"
          fi
          exit $code
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Scaffold and wire actual extension target
        run: |
          cd apps/mobile
          flutter create --project-name refract --org dev --platforms ios .
          flutter pub get
          cd ios
          gem list -i xcodeproj || gem install xcodeproj --no-document
          ruby configure_handoff.rb
          ruby configure_handoff.rb
      - name: Build static core for device and simulator
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          cargo build --release -p platform_bridge --target aarch64-apple-ios
          cargo build --release -p platform_bridge --target aarch64-apple-ios-sim
          cargo build --release -p platform_bridge --target x86_64-apple-ios
          mkdir -p target/ios-simulator-universal/release
          lipo -create target/aarch64-apple-ios-sim/release/librefract.a target/x86_64-apple-ios/release/librefract.a -output target/ios-simulator-universal/release/librefract.a
          lipo -verify_arch arm64 x86_64 target/ios-simulator-universal/release/librefract.a
      - name: Unsigned device + simulator app, embedded extension and retained ABI
        run: |
          set +e
          (cd apps/mobile && flutter build ios --release --no-codesign) 2>&1 | tee /tmp/ios-device.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=ios-device::$(tail -65 /tmp/ios-device.log | head -c 9000 | tr '\n' ' ')"
            exit $code
          fi
          python3 .github/scripts/check_ios_handoff.py apps/mobile/build/ios/iphoneos/Runner.app || exit $?
          (cd apps/mobile && flutter build ios --simulator --debug -v) 2>&1 | tee /tmp/ios-simulator.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error title=ios-simulator::$(grep -E '(^| )Ld | -force_load |Undefined symbol|error:' /tmp/ios-simulator.log | head -25 | head -c 12000 | tr '\n' ' ')"
            (cd apps/mobile/ios && xcodebuild -project Runner.xcodeproj -target Runner -configuration Debug -sdk iphonesimulator -showBuildSettings 2>&1 | grep -E 'OTHER_LDFLAGS|ENABLE_DEBUG_DYLIB|ARCHS|SDKROOT') > /tmp/ios-link-settings.log
            echo "::error title=ios-link-settings::$(head -c 12000 /tmp/ios-link-settings.log | tr '\n' ' ')"
            exit $code
          fi
          python3 .github/scripts/check_ios_handoff.py apps/mobile/build/ios/iphonesimulator/Runner.app || exit $?
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-handoff-build-evidence
          path: |
            /tmp/swift-store.log
            /tmp/swift-provider.log
            /tmp/provider-runtime.log
            /tmp/ios-device.log
            /tmp/ios-simulator.log
            /tmp/ios-link-settings.log
